name: password-failure-e2e
parent: <<PARENT>>
cpu:
  count: 2
memory:
  startup: 2048

# The cloud-config below is the TEST INPUT and is DELIBERATELY invalid: it asks
# for a local user `admin` with the password `admin`. The eryph base image
# enforces the Windows password-complexity policy, which rejects that password
# (too short, and it contains the account name) with NERR_PasswordTooShort
# (2245). UsersGroupsModule therefore throws while setting the password, the
# Config stage fails, and provisioning reports `failed`. The suite asserts that
# failure is surfaced — in the provisioning status (KVP) and the agent log —
# rather than swallowed or reported as success.
fodder:
  - name: bad-password
    type: cloud-config
    content: |
      #cloud-config
      users:
        - name: admin
          passwd: 'admin'
          groups:
            - Administrators
